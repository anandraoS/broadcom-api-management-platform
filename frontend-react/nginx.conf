server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # same-origin API: the browser never needs CORS, and the SPA never sees the backend address
  # NOTE the trailing slash: "/api" would also capture the SPA route "/apis"
  location /api/ {
    proxy_pass http://control-plane:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 30s;
  }
  location /graphql {
    proxy_pass http://control-plane:8080;
    proxy_set_header Host $host;
    client_max_body_size 256k;
  }

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # hashed build assets are immutable; index.html must always be revalidated
  location ~* \.(?:js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # baseline security headers (HSTS belongs on the TLS-terminating ingress)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
}
