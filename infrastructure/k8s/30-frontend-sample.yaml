apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend, namespace: api-platform }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: api-platform, labels: { app: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      serviceAccountName: frontend
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: registry.example.com/api-platform/frontend:1.0.0
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 64Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: cache, mountPath: /var/cache/nginx }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: cache, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: api-platform }
spec: { selector: { app: frontend }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
# Sample backend registered behind the gateway
apiVersion: v1
kind: ServiceAccount
metadata: { name: orders-service, namespace: api-platform }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders-service, namespace: api-platform, labels: { app: orders-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: orders-service } }
    spec:
      serviceAccountName: orders-service
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: orders-service
          image: registry.example.com/api-platform/orders-service:1.0.0
          ports: [{ name: http, containerPort: 9001 }]
          env: [{ name: PORT, value: "9001" }, { name: INSTANCE_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }]
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 256Mi } }
          startupProbe:   { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 3, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 5"] } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: orders-service, namespace: api-platform }
spec: { selector: { app: orders-service }, ports: [{ name: http, port: 9001, targetPort: http }] }
