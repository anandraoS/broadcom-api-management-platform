spring:
  datasource:
    url: jdbc:h2:mem:cp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
management:
  tracing:
    sampling:
      probability: 0.0
  otlp:
    tracing:
      endpoint: http://localhost:1/v1/traces
app:
  security:
    jwt-secret: test-only-secret-test-only-secret-1234
    issuer: api-platform-test
    gateway-token: test-gateway-token
    cors-origins: http://localhost:4200
  dev-auth:
    enabled: true
    password: test-only-password
  destinations:
    allowed-hosts: localhost,orders-service-1
    allow-loopback: true
