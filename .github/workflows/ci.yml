name: ci

# Pipeline stages map 1:1 to docs/ci-cd.md. No production credentials are used: tests run against H2 / Testcontainers
# and dummy values committed in test resources. NOTE: this file was authored and statically reviewed but could not be
# executed in the environment where the repository was generated (no GitHub runner); first run may need small fixes.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.0

jobs:
  backend:
    name: "1-3 Java compile, unit and integration tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Compile
        run: mvn -B -ntp -DskipTests compile
      - name: Unit tests (Surefire)
        run: mvn -B -ntp test
      - name: Integration tests (Failsafe; Testcontainers uses the runner's Docker)
        run: mvn -B -ntp verify
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            **/target/site/jacoco
      - name: Package versioned jars
        run: mvn -B -ntp -DskipTests -DskipITs package
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ env.APP_VERSION }}-${{ github.sha }}
          path: |
            control-plane/target/control-plane-*.jar
            gateway/target/gateway-*.jar
            sample-services/orders-service/target/orders-service-*.jar

  static-analysis:
    name: "6 Static analysis"
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: SpotBugs (Java)
        run: mvn -B -ntp -Pstatic-analysis compile spotbugs:check
      - uses: github/codeql-action/init@v3
        with: { languages: "java-kotlin,javascript-typescript" }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  frontend:
    name: "4-5 Angular lint, unit tests, production build"
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:ci          # Karma + ChromeHeadlessCI (no-sandbox flags for containers)
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: frontend/coverage }
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ env.APP_VERSION }}-${{ github.sha }}
          path: frontend/dist

  dependency-scan:
    name: "7 Dependency vulnerability scanning"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (Maven + npm lockfiles)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: SBOM (CycloneDX) for the Java modules
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.0:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: target/bom.* }

  images:
    name: "8-9 Container image build and scan"
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - { name: control-plane, dockerfile: control-plane/Dockerfile, context: . }
          - { name: gateway, dockerfile: gateway/Dockerfile, context: . }
          - { name: orders-service, dockerfile: sample-services/orders-service/Dockerfile, context: . }
          - { name: frontend, dockerfile: frontend/Dockerfile, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: "${{ matrix.dockerfile }}", failure-threshold: error }
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: api-platform/${{ matrix.name }}:${{ env.APP_VERSION }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: api-platform/${{ matrix.name }}:${{ env.APP_VERSION }}-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  kubernetes:
    name: "10 Helm and Kubernetes manifest validation"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint infrastructure/helm/api-platform -f infrastructure/helm/api-platform/values-prod-example.yaml
      - name: helm template | kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template api-platform infrastructure/helm/api-platform | ./kubeconform -strict -summary -kubernetes-version 1.30.0
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas infrastructure/k8s
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q

  release:
    name: "12 Versioned artifact bundle"
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, dependency-scan, images, kubernetes, static-analysis]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package chart
        run: |
          helm package infrastructure/helm/api-platform --version ${{ env.APP_VERSION }} --app-version ${{ env.APP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ env.APP_VERSION }}
          path: api-platform-*.tgz
